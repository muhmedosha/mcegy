<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Construction | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================= */

        .portfolio-header {
            height: 76px;
            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(20, 20, 20, 0.97);
            border-bottom: 1px solid rgba(194, 154, 76, 0.35);

            position: relative;
            z-index: 10;
        }

        .portfolio-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .portfolio-title h1 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .gold-line {
            width: 4px;
            height: 28px;
            background: #c49a4c;
            border-radius: 10px;
        }

        /* =========================
           BUTTONS
        ========================= */

        .portfolio-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .portfolio-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;
            padding: 0 18px;

            color: #fff;
            text-decoration: none;

            border: 1px solid rgba(196, 154, 76, 0.7);
            border-radius: 6px;

            font-size: 14px;
            font-weight: 600;

            transition: all 0.3s ease;
        }

        .portfolio-btn:hover {
            background: #c49a4c;
            color: #111;
            border-color: #c49a4c;
            transform: translateY(-1px);
        }

        .portfolio-btn.primary {
            background: #c49a4c;
            color: #111;
            border-color: #c49a4c;
        }

        .portfolio-btn.primary:hover {
            background: #d5ad63;
        }

        /* =========================
           PDF AREA
        ========================= */

        .pdf-container {
            width: 100%;
            height: calc(100vh - 76px);
            background: #222;
            position: relative;
        }

        .pdf-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #fff;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            body {
                overflow: auto;
            }

            .portfolio-header {
                height: auto;
                min-height: 120px;

                padding: 16px 18px;

                flex-direction: column;
                justify-content: center;
                align-items: stretch;

                gap: 14px;
            }

            .portfolio-title {
                justify-content: center;
            }

            .portfolio-title h1 {
                font-size: 17px;
                text-align: center;
            }

            .gold-line {
                height: 24px;
            }

            .portfolio-actions {
                width: 100%;
                justify-content: center;
            }

            .portfolio-btn {
                flex: 1;
                max-width: 180px;
                padding: 0 10px;
                font-size: 13px;
            }

            .pdf-container {
                height: calc(100vh - 120px);
                min-height: 600px;
            }

            .pdf-frame {
                height: 100%;
            }
        }

        /* =========================
           SMALL MOBILE
        ========================= */

        @media (max-width: 420px) {

            .portfolio-header {
                min-height: 132px;
            }

            .portfolio-title h1 {
                font-size: 15px;
            }

            .portfolio-actions {
                gap: 8px;
            }

            .portfolio-btn {
                font-size: 12px;
                min-height: 40px;
            }

            .pdf-container {
                height: calc(100vh - 132px);
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="portfolio-header">

        <div class="portfolio-title">

            <div class="gold-line"></div>

            <h1>
                Modern Construction — Portfolio
            </h1>

        </div>

        <div class="portfolio-actions">

            <!-- OPEN PDF DIRECTLY -->

            <a href="assets/projects.pdf/projects-portfolio.pdf"
               target="_blank"
               rel="noopener noreferrer"
               class="portfolio-btn primary">
                Open Portfolio
            </a>

            <!-- BACK TO WEBSITE -->

            <a href="index.html"
               class="portfolio-btn">
                Back to Website
            </a>

        </div>

    </header>


    <!-- PDF -->

    <main class="pdf-container">

        <iframe
            class="pdf-frame"
            src="assets/projects.pdf/projects-portfolio.pdf"
            title="Modern Construction Portfolio">
        </iframe>

    </main>

</body>

</html>
